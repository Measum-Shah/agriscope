name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pytest pytest-cov
          pip install -r backend/requirements/dev.txt

      - name: Lint and Format Check (Ruff & Black)
        run: |
          ruff check backend/app backend/tests
          black --check backend/app backend/tests

      - name: Run Backend Tests
        run: |
          pytest backend/tests --cov=backend/app --cov-report=xml

      - name: Security scan (Bandit)
        run: |
          pip install bandit
          bandit -r backend/app -x backend/app/tests -ll -q || true

      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --requirement backend/requirements/base.txt --skip-editable || true

  ml-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest
          pip install -e ./ml

      - name: Lint and Format Check
        run: |
          ruff check ml/agriscope_ml ml/service ml/tests
          black --check ml/agriscope_ml ml/service ml/tests

      - name: Run ML Tests
        run: |
          pytest ml/tests

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Unit Tests
        working-directory: frontend
        run: npm run test

      - name: Security audit (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-checks, ml-checks, frontend-checks]
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t agriscope-backend:ci -f backend/Dockerfile backend

      - name: Build ML Service Image
        run: docker build -t agriscope-ml:ci -f ml/Dockerfile ml

      - name: Build Frontend Image
        run: docker build -t agriscope-frontend:ci -f frontend/Dockerfile frontend
