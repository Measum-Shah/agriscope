services:
  nginx:
    image: nginx:1.25-alpine
    container_name: agriscope-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - agriscope-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agriscope-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api/v1
    ports:
      - "5173:5173"
    networks:
      - agriscope-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agriscope-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
      - ML_SERVICE_URL=http://ml-service:8001
      - CELERY_BROKER_URL=redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-create-buckets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agriscope-network

  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: agriscope-ml
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agriscope-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agriscope-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -l info -Q default
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - agriscope-network

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agriscope-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat -l info
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agriscope-network

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: agriscope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agriscope}
      POSTGRES_USER: ${POSTGRES_USER:-agriscope_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agriscope_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agriscope_user} -d ${POSTGRES_DB:-agriscope}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agriscope-network

  redis:
    image: redis:7-alpine
    container_name: agriscope-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - agriscope-network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: agriscope-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agriscope-network

  minio-create-buckets:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: agriscope-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_DEFAULT_BUCKET:-agriscope-bucket};
      /usr/bin/mc anonymous set download myminio/${MINIO_DEFAULT_BUCKET:-agriscope-bucket};
      exit 0;
      "
    networks:
      - agriscope-network

  mailpit:
    image: axllent/mailpit:v1.18
    container_name: agriscope-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - agriscope-network

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: agriscope-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - agriscope-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: agriscope-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards/agriscope:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - agriscope-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  agriscope-network:
    driver: bridge
