global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "production"
    app: "agriscope"

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "agriscope-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          app: "agriscope-backend"

  - job_name: "agriscope-ml"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ml-service:8001"]
        labels:
          app: "agriscope-ml"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
