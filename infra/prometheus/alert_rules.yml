groups:
  - name: agriscope_api_alerts
    interval: 30s
    rules:
      - alert: HighAPIErrorRate
        expr: |
          sum(rate(agriscope_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(agriscope_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High API error rate (>5%)"
          description: "API error rate exceeds 5% over 5m window."

      - alert: SlowAPILatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(agriscope_http_request_duration_seconds_bucket[5m])) by (le, endpoint)
          ) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 API latency > 2s"
          description: "p95 latency on {{ $labels.endpoint }} is above 2.0s."

  - name: agriscope_ml_alerts
    rules:
      - alert: MLInferenceSlowdown
        expr: |
          histogram_quantile(0.95,
            rate(agriscope_ml_inference_duration_seconds_bucket[5m]) by (le)
          ) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "ML inference p95 latency > 500ms"
          description: "ML model inference latency has degraded."
