events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;
    server_tokens off;

    # Global security headers applied to all server responses
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.open-meteo.com https://nominatim.openstreetmap.org https://power.larc.nasa.gov wss:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self';" always;
    # HSTS: enable on HTTPS production deployments only
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    upstream frontend_upstream {
        server frontend:5173;
    }

    upstream api_upstream {
        server api:8000;
    }

    upstream ml_upstream {
        server ml-service:8001;
    }

    upstream minio_console_upstream {
        server minio:9001;
    }

    upstream grafana_upstream {
        server grafana:3000;
    }

    upstream mailpit_upstream {
        server mailpit:8025;
    }

    server {
        listen 80;
        server_name localhost;

        # API routing
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Remove server identification headers
            proxy_hide_header Server;
            proxy_hide_header X-Powered-By;
        }

        # Health / Readiness / Metrics — restrict to internal networks
        location ~ ^/(health|ready|metrics) {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Allow only private RFC-1918 ranges + localhost
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
        }

        # ML service internal API
        location /ml/ {
            rewrite ^/ml/(.*) /$1 break;
            proxy_pass http://ml_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Mailpit web UI (dev only — restrict in prod)
        location /mailpit/ {
            proxy_pass http://mailpit_upstream/;
            proxy_set_header Host $host;
        }

        # MinIO console (dev only)
        location /minio/ {
            proxy_pass http://minio_console_upstream/;
            proxy_set_header Host $host;
        }

        # Grafana (dev only)
        location /grafana/ {
            proxy_pass http://grafana_upstream;
            proxy_set_header Host $host;
        }

        # Frontend SPA (Vite dev / production static)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
        }
    }
}
