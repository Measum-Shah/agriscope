[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agriscope_ml"
version = "0.1.0"
description = "AgriScope Machine Learning Package for Evapotranspiration Estimation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.3",
    "lightgbm>=4.3.0",
    "shap>=0.45.0",
    "joblib>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pyarrow>=15.0.0",
    "httpx>=0.27.0",
    "optuna>=3.6.0",
    "boto3>=1.34.0",
]

[project.scripts]
agriscope-ml = "agriscope_ml.cli:main"

[tool.setuptools.packages.find]
include = ["agriscope_ml*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
